<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nutrition Workshop - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .card-icon {
            font-size: 2rem;
            margin-right: 15px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            color: #555;
        }

        tr:hover {
            background: #f8f9ff;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #777;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .table-container {
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-size: 1.1rem;
        }

        /* Accessible visually-hidden utility for screen-reader-only labels */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
        
        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🥗 Nutrition Workshop Dashboard</h1>
            <p>Professional Nutrition & Food Tracking System</p>
        </div>

        <!-- Statistics -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalFoods">0</div>
                <div class="stat-label">Food Items</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalParticipants">0</div>
                <div class="stat-label">Participants</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalLogs">--</div>
                <div class="stat-label">Food Logs</div>
            </div>
        </div>

        <!-- Main Dashboard Grid -->
        <div class="dashboard-grid">
            <!-- Food Items Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-icon">🍎</span>
                    <h2 class="card-title">Food Database</h2>
                </div>
                
                <div class="form-group">
                    <div class="form-row">
                        <input type="text" id="foodName" placeholder="Food name (e.g., Apple)">
                        <input type="number" id="foodCalories" placeholder="Calories per 100g">
                    </div>
                    <button onclick="addFood()">➕ Add Food Item</button>
                    <button class="btn-secondary" onclick="loadFoods()" style="margin-left: 10px;">🔄 Refresh</button>
                </div>

                <div class="table-container">
                    <div id="foodList" class="loading">Loading food items...</div>
                </div>
            </div>

            <!-- Participants Card -->
            <div class="card">
                <div class="card-header">
                    <span class="card-icon">👥</span>
                    <h2 class="card-title">Participants</h2>
                </div>
                
                <div class="form-group">
                    <div class="form-row">
                        <input type="text" id="partName" placeholder="Full Name">
                        <input type="text" id="partGender" placeholder="Gender">
                    </div>
                    <div class="form-row">
                        <input type="email" id="partEmail" placeholder="Email (optional)">
                        <input type="text" id="partPhone" placeholder="Phone (optional)">
                    </div>
                    <button onclick="addParticipant()">➕ Register Participant</button>
                    <button class="btn-secondary" onclick="loadParticipants()" style="margin-left: 10px;">🔄 Refresh</button>
                </div>

                <div class="table-container">
                    <div id="participantList" class="loading">Loading participants...</div>
                </div>
            </div>
        </div>

        <!-- Food Logging Card (Full Width) -->
        <div class="card">
            <div class="card-header">
                <span class="card-icon">🍽️</span>
                <h2 class="card-title">Log Food Consumption</h2>
            </div>
            
            <div id="logSuccess" class="success-message"></div>
            
            <div class="form-row">
                <label for="logMeal" class="sr-only">Meal type</label>
                 <input type="number" id="logPartId" placeholder="Participant ID">
                 <input type="number" id="logFoodId" placeholder="Food Item ID">
                 <input type="number" id="logQty" placeholder="Quantity (grams)">
                 <select id="logMeal" aria-label="Meal type">
                     <option value="">Select Meal Type</option>
                     <option value="breakfast">🌅 Breakfast</option>
                     <option value="lunch">☀️ Lunch</option>
                     <option value="dinner">🌙 Dinner</option>
                     <option value="snack">🍿 Snack</option>
                 </select>
             </div>
            <button class="btn-success" onclick="logFood()">📝 Log Food Entry</button>
        </div>
    </div>

    <script>
        const API = 'http://127.0.0.1:5000';

        // Load and display food items
        async function loadFoods() {
            try {
                const response = await fetch(`${API}/food_items`);
                const foods = await response.json();
                
                document.getElementById('totalFoods').textContent = foods.length;
                
                if (foods.length === 0) {
                    document.getElementById('foodList').innerHTML = '<div class="empty-state">No food items yet. Add one above!</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>ID</th><th>Food Name</th><th>Calories/100g</th></tr></thead><tbody>';
                foods.forEach(f => {
                    html += `<tr><td><strong>#${f.id}</strong></td><td>${f.name}</td><td>${f.calories_per_100g} kcal</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('foodList').innerHTML = html;
            } catch(e) {
                document.getElementById('foodList').innerHTML = '<div class="empty-state">⚠️ Error loading data. Is the server running?</div>';
            }
        }

        // Add new food item
        async function addFood() {
            const name = document.getElementById('foodName').value.trim();
            const calories = document.getElementById('foodCalories').value;
            
            if (!name || !calories) {
                alert('⚠️ Please fill in both food name and calories!');
                return;
            }
            
            try {
                await fetch(`${API}/food_items`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, calories_per_100g: parseFloat(calories)})
                });
                
                document.getElementById('foodName').value = '';
                document.getElementById('foodCalories').value = '';
                showSuccess('✅ Food item added successfully!');
                loadFoods();
            } catch(e) {
                alert('❌ Error adding food item!');
            }
        }

        // Load and display participants
        async function loadParticipants() {
            try {
                const response = await fetch(`${API}/participants`);
                const parts = await response.json();
                
                document.getElementById('totalParticipants').textContent = parts.length;
                
                if (parts.length === 0) {
                    document.getElementById('participantList').innerHTML = '<div class="empty-state">No participants yet. Register one above!</div>';
                    return;
                }
                
                let html = '<table><thead><tr><th>ID</th><th>Name</th><th>Gender</th><th>Contact</th></tr></thead><tbody>';
                parts.forEach(p => {
                    const contact = p.email || p.phone || '-';
                    html += `<tr><td><strong>#${p.id}</strong></td><td>${p.name}</td><td>${p.gender}</td><td>${contact}</td></tr>`;
                });
                html += '</tbody></table>';
                document.getElementById('participantList').innerHTML = html;
            } catch(e) {
                document.getElementById('participantList').innerHTML = '<div class="empty-state">⚠️ Error loading data!</div>';
            }
        }

        // Add new participant
        async function addParticipant() {
            const name = document.getElementById('partName').value.trim();
            const gender = document.getElementById('partGender').value.trim();
            const email = document.getElementById('partEmail').value.trim();
            const phone = document.getElementById('partPhone').value.trim();
            
            if (!name || !gender) {
                alert('⚠️ Please enter at least name and gender!');
                return;
            }
            
            try {
                await fetch(`${API}/participants`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, gender, email, phone})
                });
                
                document.getElementById('partName').value = '';
                document.getElementById('partGender').value = '';
                document.getElementById('partEmail').value = '';
                document.getElementById('partPhone').value = '';
                showSuccess('✅ Participant registered successfully!');
                loadParticipants();
            } catch(e) {
                alert('❌ Error registering participant!');
            }
        }

        // Log food consumption
        async function logFood() {
            const pid = document.getElementById('logPartId').value;
            const fid = document.getElementById('logFoodId').value;
            const qty = document.getElementById('logQty').value;
            const meal = document.getElementById('logMeal').value;
            
            if (!pid || !fid || !qty) {
                alert('⚠️ Please fill in Participant ID, Food ID, and Quantity!');
                return;
            }
            
            try {
                const response = await fetch(`${API}/participants/${pid}/food_logs`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        food_item_id: parseInt(fid),
                        quantity_g: parseFloat(qty),
                        meal_type: meal || null
                    })
                });
                const result = await response.json();
                
                document.getElementById('logPartId').value = '';
                document.getElementById('logFoodId').value = '';
                document.getElementById('logQty').value = '';
                document.getElementById('logMeal').value = '';
                
                showSuccess(`✅ Food logged! Calories: ${result.calories.toFixed(2)} kcal`);
            } catch(e) {
                alert('❌ Error logging food. Check IDs!');
            }
        }

        function showSuccess(message) {
            const elem = document.getElementById('logSuccess');
            elem.textContent = message;
            elem.style.display = 'block';
            setTimeout(() => {
                elem.style.display = 'none';
            }, 3000);
        }

        // Load initial data
        window.onload = function() {
            loadFoods();
            loadParticipants();
        }
    </script>
</body>
</html>
